  <style>
    :root{font-family:'DM Sans',sans-serif;color:#24312c;background:#f4f5ef;font-synthesis:none;--ink:#24312c;--muted:#758079;--line:#e4e8df;--paper:#fff;--green:#183c36;--lime:#d8ee84;--orange:#e87b4a;--soft:#f4f5ef;--serif:'DM Serif Display',Georgia,serif}
    *{box-sizing:border-box}body{margin:0;min-width:320px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a6c85b;outline-offset:2px}.shell{min-height:100vh;display:grid;grid-template-columns:246px minmax(0,1fr)}aside{background:var(--green);color:white;padding:28px 18px;display:flex;flex-direction:column;min-height:100vh;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:11px;padding:2px 10px 34px}.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--lime);color:var(--green);display:grid;place-items:center;font-weight:700;font-size:19px}.brand-name{font-family:var(--serif);font-size:24px;line-height:1}.brand-sub{font-size:10px;color:#b8c8bd;letter-spacing:.08em;text-transform:uppercase;margin-top:5px}.nav-label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#9eb4a8;padding:0 12px;margin:0 0 10px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#d4dfd8;text-align:left;padding:11px 12px;border-radius:7px;display:flex;align-items:center;gap:12px;font-size:13px}.nav button:hover,.nav button.active{background:#ffffff18;color:white}.nav-icon{font-size:16px;width:20px;text-align:center}.side-bottom{margin-top:auto}.side-note{margin:0 8px 18px;padding:14px;border:1px solid #ffffff20;border-radius:8px;color:#c5d3cb;font-size:11px;line-height:1.55}.side-note strong{color:white;display:block;font-size:12px;margin-bottom:4px}.role-button{width:100%;border:1px solid #ffffff3b;background:transparent;color:white;border-radius:7px;padding:11px 12px;font-size:12px;text-align:left;display:flex;justify-content:space-between;align-items:center}.main{min-width:0}.topbar{height:74px;padding:0 42px;border-bottom:1px solid var(--line);background:#f8f9f5;display:flex;align-items:center;justify-content:space-between}.crumb{font-size:12px;color:var(--muted)}.crumb b{color:var(--ink);font-weight:600}.top-right{display:flex;align-items:center;gap:18px}.season{font-size:11px;color:var(--muted)}.avatar{width:32px;height:32px;border-radius:50%;background:#e8eddd;display:grid;place-items:center;color:var(--green);font-weight:700;font-size:12px}.content{max-width:1220px;margin:0 auto;padding:36px 42px 64px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:29px}.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#698072;font-weight:700;margin-bottom:9px}.page-head h1,.public-panel h1{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.08;margin:0;color:var(--ink)}.page-head p{font-size:13px;color:var(--muted);margin:9px 0 0}.btn{border:0;border-radius:6px;padding:10px 14px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn-primary{background:var(--green);color:white}.btn-primary:hover{background:#245249}.btn-light{background:white;border:1px solid var(--line);color:var(--ink)}.btn-light:hover{background:#f7f9f3}.btn-danger{background:#fff1ec;color:#a34124}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:25px}.stat{background:var(--paper);border:1px solid var(--line);padding:17px 18px;border-radius:7px}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}.stat-mark{width:8px;height:8px;border-radius:50%;background:#8aa358}.stat-num{font-size:27px;font-weight:600;letter-spacing:0;margin-top:12px;line-height:1}.stat-caption{font-size:10px;color:var(--muted);margin-top:7px}.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(250px,.8fr);gap:17px}.panel{background:white;border:1px solid var(--line);border-radius:7px;min-width:0}.panel-head{padding:18px 20px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.panel-title{font-size:13px;font-weight:700}.panel-link{font-size:11px;color:#547763;text-decoration:none;cursor:pointer;background:none;border:0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#89928b;font-weight:600;padding:10px 18px;border-top:1px solid #eef0ea}td{padding:13px 18px;border-top:1px solid #eef0ea;font-size:12px;white-space:nowrap}td:first-child{font-weight:600}.muted{color:var(--muted);font-weight:400!important}.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:4px;background:#eef5e5;color:#58713e;font-size:10px;font-weight:600}.badge:before{content:'';width:5px;height:5px;border-radius:50%;background:#8aa358}.badge.pending{background:#fff3e7;color:#9a6933}.badge.pending:before{background:#df9c48}.activity{padding:0 20px 15px}.activity-item{padding:12px 0;border-top:1px solid #eef0ea;display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px}.activity-icon{width:28px;height:28px;border-radius:7px;background:#f1f4ec;display:grid;place-items:center;color:#597362;font-size:13px}.activity-copy{font-size:11px;line-height:1.45}.activity-copy span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.activity-time{font-size:10px;color:#929b94}.section-tools{display:flex;align-items:center;gap:8px}.search{width:210px;border:1px solid var(--line);border-radius:6px;padding:9px 11px;background:white;font-size:12px}.content-panel{background:white;border:1px solid var(--line);border-radius:7px;overflow:hidden}.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}.action{border:0;background:none;color:#526b59;font-size:12px;padding:5px}.icon-btn{width:30px;height:30px;border:1px solid var(--line);border-radius:5px;background:white;color:#617168}.course-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.course-card{background:white;border:1px solid var(--line);border-radius:7px;padding:18px;position:relative}.course-card:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#9bb563;border-radius:7px 0 0 7px}.course-card h3{font-size:15px;margin:0 0 6px}.course-card p{font-size:11px;color:var(--muted);margin:0}.course-meta{display:flex;gap:17px;border-top:1px solid var(--line);margin-top:17px;padding-top:13px;font-size:11px;color:#55645a}.course-meta b{color:var(--ink);font-size:13px;margin-right:3px}.question-row{display:flex;align-items:center;gap:14px;padding:15px 19px;border-top:1px solid #eef0ea}.q-number{font-family:var(--serif);color:#829567;font-size:19px;width:20px}.q-copy{flex:1;font-size:12px}.q-copy small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.modal-backdrop{position:fixed;inset:0;background:#18251f88;z-index:5;display:grid;place-items:center;padding:20px}.modal{width:min(490px,100%);background:white;border-radius:8px;padding:23px;box-shadow:0 20px 65px #1113}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-head h2{font-family:var(--serif);font-weight:400;font-size:23px;margin:0}.form-grid{display:grid;gap:14px}.field{display:grid;gap:6px}.field label{font-size:11px;font-weight:600;color:#526059}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe4dc;background:white;border-radius:5px;padding:10px 11px;font-size:12px;color:var(--ink)}.field textarea{min-height:78px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.hidden{display:none!important}.public-shell{min-height:100vh;background:#f4f5ef}.public-top{height:66px;background:var(--green);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 max(calc((100vw - 1060px)/2),24px)}.public-top .brand{padding:0}.public-top .brand-name{font-size:22px}.public-top button{border:1px solid #ffffff52;background:transparent;color:white;border-radius:5px;padding:8px 11px;font-size:11px}.public-wrap{max-width:1000px;margin:0 auto;padding:47px 24px 70px}.public-intro{max-width:510px;margin-bottom:26px}.public-panel{max-width:620px;background:white;border:1px solid var(--line);border-radius:8px;padding:28px}.public-panel h1{font-size:29px}.public-panel>p{font-size:12px;color:var(--muted);line-height:1.6;margin:10px 0 22px}.step-indicator{display:flex;align-items:center;gap:8px;margin-bottom:22px}.step-dot{width:23px;height:23px;border-radius:50%;background:#e9ede5;color:#778279;font-size:10px;display:grid;place-items:center}.step-dot.done{background:var(--green);color:white}.step-line{height:1px;width:35px;background:#dfe4dc}.notice{font-size:11px;background:#f4f6ed;border-left:3px solid #a9bf6f;padding:11px 12px;color:#59664e;line-height:1.5;margin:16px 0}.code-input{letter-spacing:.35em;font-size:20px!important;max-width:240px}.question-block{padding:18px 0;border-top:1px solid var(--line)}.question-block h3{font-size:13px;margin:0 0 11px;line-height:1.45}.scale{display:flex;gap:7px}.scale button{height:36px;width:40px;border:1px solid var(--line);background:white;border-radius:5px;color:#56645b;font-size:12px}.scale button.selected{background:var(--green);border-color:var(--green);color:white}.success{text-align:center;padding:18px 4px}.success-mark{width:48px;height:48px;border-radius:50%;background:#eaf3dc;color:#55783e;display:grid;place-items:center;font-size:23px;margin:0 auto 15px}.success h2{font-family:var(--serif);font-size:25px;font-weight:400;margin:0 0 8px}.success p{font-size:12px;color:var(--muted);line-height:1.6}.toast{position:fixed;bottom:22px;right:22px;padding:12px 16px;background:#213e34;color:white;border-radius:6px;font-size:12px;z-index:10;box-shadow:0 6px 24px #17291c30;animation:rise .2s ease-out}@keyframes rise{from{transform:translateY(7px);opacity:0}to{transform:none;opacity:1}}.footer-note{margin-top:24px;color:#8a938c;font-size:10px}
    @media(max-width:900px){.shell{grid-template-columns:205px minmax(0,1fr)}.content{padding:30px 24px 50px}.topbar{padding:0 24px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-grid{grid-template-columns:1fr}.course-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:620px){.shell{display:block}aside{min-height:unset;height:auto;position:relative;padding:14px 14px 10px}.brand{padding:0 4px 13px}.brand-sub,.nav-label{display:none}.side-bottom{display:block}.side-note{display:none}.role-button{position:absolute;right:14px;top:14px;width:auto;padding:8px 9px;font-size:10px}.nav{display:flex;overflow-x:auto;gap:3px;padding-bottom:2px}.nav button{flex:0 0 auto;padding:9px 10px;font-size:11px;gap:7px}.nav-icon{font-size:14px;width:auto}.topbar{height:52px;padding:0 17px}.season{display:none}.content{padding:25px 16px 42px}.page-head{align-items:flex-start;margin-bottom:21px}.page-head h1{font-size:29px}.page-head p{font-size:11px}.page-head>.btn{padding:9px 10px;font-size:11px;white-space:nowrap}.stats{gap:9px}.stat{padding:14px}.stat-num{font-size:23px}.stat-top{font-size:10px}.section-tools{flex-wrap:wrap}.search{width:min(100%,190px)}.course-grid{grid-template-columns:1fr}.public-top{height:58px;padding:0 16px}.public-wrap{padding:30px 15px}.public-panel{padding:21px 17px}.public-panel h1{font-size:26px}.table-wrap{margin:0 -1px}.content-panel{overflow:hidden}th,td{padding-left:12px;padding-right:12px}.page-head .eyebrow{margin-bottom:6px}}
  </style>

<body>
  <div id="adminApp" class="shell">
    <aside>
      <div class="brand"><div class="brand-mark">r.</div><div><div class="brand-name">ronda</div><div class="brand-sub">Coevaluación</div></div></div>
      <div class="nav-label">Espacio de trabajo</div>
      <nav class="nav" aria-label="Navegación de administración">
        <button class="active" data-view="overview"><span class="nav-icon">⌂</span> Resumen</button>
        <button data-view="courses"><span class="nav-icon">▦</span> Cursos</button>
        <button data-view="students"><span class="nav-icon">♙</span> Alumnos</button>
        <button data-view="questions"><span class="nav-icon">☷</span> Preguntas</button>
        <button data-view="grades"><span class="nav-icon">⌁</span> Notas</button>
      </nav>
      <div class="side-bottom"><div class="side-note"><strong>Datos de demostración</strong>La información se guarda solo en este navegador.</div><button class="role-button" id="publicMode">Abrir vista alumnado <span>↗</span></button></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="crumb">Ronda <span> / </span> <b id="crumbTitle">Resumen</b></div><div class="top-right"><span class="season">Curso 2025 – 2026</span><div class="avatar">AD</div></div></header>
      <div class="content" id="adminContent"></div>
    </main>
  </div>
  <div id="publicApp" class="public-shell hidden">
    <header class="public-top"><div class="brand"><div class="brand-mark">r.</div><div class="brand-name">ronda</div></div><button id="adminMode">← Administración</button></header>
    <main class="public-wrap"><div class="public-intro"><div class="eyebrow">Coevaluación · Curso 2025–2026</div><h1 style="font:400 36px/1.05 var(--serif);margin:0">Tu mirada también cuenta.</h1></div><section class="public-panel" id="publicPanel"></section></main>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRoot" aria-live="polite"></div>
  <script>
    const seed={courses:[{id:'c1',name:'Diseño de servicios',group:'2.º A',year:'2025–2026'},{id:'c2',name:'Proyectos colaborativos',group:'3.º B',year:'2025–2026'}],students:[{id:'s1',name:'Lucía Fernández',email:'lucia.fernandez@alumnos.edu',courseId:'c1'},{id:'s2',name:'Mateo Ruiz',email:'mateo.ruiz@alumnos.edu',courseId:'c1'},{id:'s3',name:'Inés Martín',email:'ines.martin@alumnos.edu',courseId:'c1'},{id:'s4',name:'Daniel Ortega',email:'daniel.ortega@alumnos.edu',courseId:'c1'},{id:'s5',name:'Clara Vidal',email:'clara.vidal@alumnos.edu',courseId:'c2'},{id:'s6',name:'Pablo Santos',email:'pablo.santos@alumnos.edu',courseId:'c2'}],questions:[{id:'q1',text:'¿Cómo contribuyó esta persona al avance del equipo?',type:'scale'},{id:'q2',text:'¿Qué hizo especialmente bien durante el proyecto?',type:'text'},{id:'q3',text:'¿Qué podría probar para colaborar mejor?',type:'text'}],grades:[{id:'g1',studentId:'s1',courseId:'c1',score:8.5},{id:'g2',studentId:'s2',courseId:'c1',score:9},{id:'g3',studentId:'s3',courseId:'c1',score:8},{id:'g4',studentId:'s4',courseId:'c1',score:7.5},{id:'g5',studentId:'s5',courseId:'c2',score:9.2},{id:'g6',studentId:'s6',courseId:'c2',score:8.7}],responses:{}};
    let data;try{data=JSON.parse(localStorage.getItem('ronda-data'))||structuredClone(seed)}catch{data=structuredClone(seed)}
    let currentView='overview',studentStep=1,selectedCourse='',selectedStudent='',verified=false,answers={};
    const persist=()=>localStorage.setItem('ronda-data',JSON.stringify(data));
    const esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const courseName=id=>data.courses.find(x=>x.id===id)?.name||'Sin curso';
    const studentName=id=>data.students.find(x=>x.id===id)?.name||'Alumno eliminado';
    const notify=msg=>{const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>root.innerHTML='',2600)};
    const navItems={overview:'Resumen',courses:'Cursos',students:'Alumnos',questions:'Preguntas',grades:'Notas'};
    function setView(view){currentView=view;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.getElementById('crumbTitle').textContent=navItems[view];renderAdmin()}
    document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
    function renderAdmin(){const root=document.getElementById('adminContent');if(currentView==='overview')root.innerHTML=overview();if(currentView==='courses')root.innerHTML=coursesView();if(currentView==='students')root.innerHTML=studentsView();if(currentView==='questions')root.innerHTML=questionsView();if(currentView==='grades')root.innerHTML=gradesView();bindAdminActions()}
    function overview(){const submitted=Object.keys(data.responses).length;return `<div class="page-head"><div><div class="eyebrow">Panel de administración</div><h1>Buenos días.</h1><p>Un vistazo al trabajo de tus grupos.</p></div><button class="btn btn-primary" onclick="openModal('course')">＋ Nuevo curso</button></div><div class="stats"><div class="stat"><div class="stat-top">Cursos activos<span class="stat-mark"></span></div><div class="stat-num">${data.courses.length}</div><div class="stat-caption">En el curso actual</div></div><div class="stat"><div class="stat-top">Alumnos registrados<span class="stat-mark" style="background:#e5a060"></span></div><div class="stat-num">${data.students.length}</div><div class="stat-caption">En todos los cursos</div></div><div class="stat"><div class="stat-top">Preguntas del formulario<span class="stat-mark" style="background:#7c9eac"></span></div><div class="stat-num">${data.questions.length}</div><div class="stat-caption">Activas para coevaluar</div></div><div class="stat"><div class="stat-top">Respuestas recibidas<span class="stat-mark" style="background:#a98dba"></span></div><div class="stat-num">${submitted}</div><div class="stat-caption">En este navegador</div></div></div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><div class="panel-title">Tus cursos</div><button class="panel-link" onclick="setView('courses')">Ver todos →</button></div>${data.courses.length?`<div class="table-wrap"><table><thead><tr><th>Curso</th><th>Grupo</th><th>Alumnos</th><th>Estado</th></tr></thead><tbody>${data.courses.slice(0,5).map(c=>`<tr><td>${esc(c.name)}</td><td class="muted">${esc(c.group)}</td><td>${data.students.filter(s=>s.courseId===c.id).length}</td><td><span class="badge">Activo</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Aún no hay cursos. Crea uno para empezar.</div>'}</section><section class="panel"><div class="panel-head"><div class="panel-title">Siguiente paso</div></div><div class="activity"><div class="activity-item"><div class="activity-icon">＋</div><div class="activity-copy">Añade alumnos y sus correos<span>Vincúlalos con un curso</span></div><button class="panel-link" onclick="setView('students')">Abrir →</button></div><div class="activity-item"><div class="activity-icon">☷</div><div class="activity-copy">Prepara las preguntas<span>Configura tu formulario</span></div><button class="panel-link" onclick="setView('questions')">Abrir →</button></div><div class="activity-item"><div class="activity-icon">↗</div><div class="activity-copy">Prueba la vista de alumnos<span>Recorre el flujo de acceso</span></div><button class="panel-link" onclick="showPublic()">Abrir →</button></div></div></section></div><div class="footer-note">Ronda · Entorno de demostración. La autenticación y el envío de correo aún no están conectados.</div>`}
    function coursesView(){return `<div class="page-head"><div><div class="eyebrow">Organización</div><h1>Cursos</h1><p>Grupos y ciclos en los que se realiza la coevaluación.</p></div><button class="btn btn-primary" onclick="openModal('course')">＋ Añadir curso</button></div>${data.courses.length?`<div class="course-grid">${data.courses.map(c=>`<article class="course-card"><h3>${esc(c.name)}</h3><p>${esc(c.group)} · ${esc(c.year||'')}</p><div class="course-meta"><span><b>${data.students.filter(s=>s.courseId===c.id).length}</b> alumnos</span><span><b>${data.grades.filter(g=>g.courseId===c.id).length}</b> notas</span></div><div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="action" data-delete-course="${c.id}">Eliminar</button></div></article>`).join('')}</div>`:'<div class="content-panel empty">Todavía no hay cursos. Añade el primero.</div>'}`}
    function studentsView(){return `<div class="page-head"><div><div class="eyebrow">Personas</div><h1>Alumnos</h1><p>Gestiona los grupos y correos de acceso.</p></div><button class="btn btn-primary" onclick="openModal('student')">＋ Añadir alumno</button></div><section class="content-panel"><div class="panel-head"><span class="panel-title">${data.students.length} alumnos</span><input id="studentSearch" class="search" placeholder="Buscar alumno o correo…" aria-label="Buscar alumnos"></div><div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Correo electrónico</th><th>Curso</th><th></th></tr></thead><tbody id="studentRows">${studentRows()}</tbody></table></div></section>`}
    function studentRows(search=''){const filtered=data.students.filter(s=>(s.name+' '+s.email+' '+courseName(s.courseId)).toLowerCase().includes(search.toLowerCase()));return filtered.length?filtered.map(s=>`<tr><td>${esc(s.name)}</td><td class="muted">${esc(s.email)}</td><td>${esc(courseName(s.courseId))}</td><td><button class="action" data-delete-student="${s.id}">Eliminar</button></td></tr>`).join(''):'<tr><td colspan="4" class="muted">No hay resultados.</td></tr>'}
    function questionsView(){return `<div class="page-head"><div><div class="eyebrow">Formulario</div><h1>Preguntas</h1><p>Define qué aspectos del trabajo en equipo evaluarán.</p></div><button class="btn btn-primary" onclick="openModal('question')">＋ Añadir pregunta</button></div><section class="content-panel"><div class="panel-head"><span class="panel-title">${data.questions.length} preguntas activas</span></div>${data.questions.length?data.questions.map((q,i)=>`<div class="question-row"><span class="q-number">${String(i+1).padStart(2,'0')}</span><div class="q-copy">${esc(q.text)}<small>${q.type==='scale'?'Escala de 1 a 5':'Respuesta abierta'}</small></div><button class="action" data-delete-question="${q.id}">Eliminar</button></div>`).join(''):'<div class="empty">Añade preguntas para preparar el formulario.</div>'}</section><div class="footer-note">Las preguntas nuevas aparecerán en el formulario público de demostración.</div>`}
    function gradesView(){return `<div class="page-head"><div><div class="eyebrow">Evaluación</div><h1>Notas</h1><p>Consulta y ajusta la nota de cada alumno.</p></div></div><section class="content-panel"><div class="panel-head"><span class="panel-title">Notas por curso</span><span class="season">Escala de 0 a 10</span></div><div class="table-wrap"><table><thead><tr><th>Alumno</th><th>Curso</th><th>Nota</th><th>Última evaluación</th></tr></thead><tbody>${data.students.map(s=>{const g=data.grades.find(x=>x.studentId===s.id)||{id:'',score:''};return `<tr><td>${esc(s.name)}</td><td class="muted">${esc(courseName(s.courseId))}</td><td><input aria-label="Nota de ${esc(s.name)}" data-grade="${s.id}" type="number" min="0" max="10" step="0.1" value="${g.score}" style="width:70px;padding:6px;border:1px solid var(--line);border-radius:4px"></td><td class="muted">${g.score===''?'Sin nota':'Actualizada'}</td></tr>`}).join('')||'<tr><td colspan="4" class="muted">Añade alumnos para introducir notas.</td></tr>'}</tbody></table></div></section>`}
    function bindAdminActions(){document.querySelectorAll('[data-delete-course]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar este curso y sus alumnos?')){const id=b.dataset.deleteCourse;const ids=data.students.filter(s=>s.courseId===id).map(s=>s.id);data.courses=data.courses.filter(c=>c.id!==id);data.students=data.students.filter(s=>s.courseId!==id);data.grades=data.grades.filter(g=>g.courseId!==id);ids.forEach(x=>delete data.responses[x]);persist();renderAdmin()}});document.querySelectorAll('[data-delete-student]').forEach(b=>b.onclick=()=>{const id=b.dataset.deleteStudent;data.students=data.students.filter(s=>s.id!==id);data.grades=data.grades.filter(g=>g.studentId!==id);delete data.responses[id];persist();renderAdmin()});document.querySelectorAll('[data-delete-question]').forEach(b=>b.onclick=()=>{data.questions=data.questions.filter(q=>q.id!==b.dataset.deleteQuestion);persist();renderAdmin()});const search=document.getElementById('studentSearch');if(search)search.oninput=()=>document.getElementById('studentRows').innerHTML=studentRows(search.value);document.querySelectorAll('[data-grade]').forEach(input=>input.onchange=()=>{const st=data.students.find(s=>s.id===input.dataset.grade);let grade=data.grades.find(g=>g.studentId===st.id);if(!grade){grade={id:crypto.randomUUID(),studentId:st.id,courseId:st.courseId,score:0};data.grades.push(grade)}grade.score=Math.max(0,Math.min(10,Number(input.value)||0));input.value=grade.score;persist();notify('Nota guardada')})}
    function openModal(type){const root=document.getElementById('modalRoot');let title='',fields='';if(type==='course'){title='Añadir curso';fields='<div class="field"><label for="courseName">Nombre del curso</label><input id="courseName" required placeholder="Ej. Diseño de servicios"></div><div class="field"><label for="courseGroup">Grupo</label><input id="courseGroup" required placeholder="Ej. 2.º A"></div><div class="field"><label for="courseYear">Año académico</label><input id="courseYear" value="2025–2026" required></div>'}if(type==='student'){title='Añadir alumno';fields=`<div class="field"><label for="studentName">Nombre y apellidos</label><input id="studentName" required placeholder="Nombre del alumno"></div><div class="field"><label for="studentEmail">Correo electrónico</label><input id="studentEmail" required type="email" placeholder="alumno@centro.edu"></div><div class="field"><label for="studentCourse">Curso</label><select id="studentCourse" required>${data.courses.map(c=>`<option value="${c.id}">${esc(c.name)} · ${esc(c.group)}</option>`).join('')}</select>${data.courses.length?'':'<small>Crea un curso antes de añadir alumnos.</small>'}</div>`}if(type==='question'){title='Nueva pregunta';fields='<div class="field"><label for="questionText">Enunciado</label><textarea id="questionText" required placeholder="Escribe una pregunta clara y concreta"></textarea></div><div class="field"><label for="questionType">Tipo de respuesta</label><select id="questionType"><option value="text">Respuesta abierta</option><option value="scale">Escala de 1 a 5</option></select></div>'}root.innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><form class="modal" id="modalForm"><div class="modal-head"><h2>${title}</h2><button type="button" class="icon-btn" id="closeModal" aria-label="Cerrar">×</button></div><div class="form-grid">${fields}</div><div class="modal-actions"><button type="button" class="btn btn-light" id="cancelModal">Cancelar</button><button type="submit" class="btn btn-primary">Guardar</button></div></form></div>`;document.getElementById('closeModal').onclick=closeModal;document.getElementById('cancelModal').onclick=closeModal;document.getElementById('modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};document.getElementById('modalForm').onsubmit=e=>{e.preventDefault();if(type==='course')data.courses.push({id:crypto.randomUUID(),name:document.getElementById('courseName').value.trim(),group:document.getElementById('courseGroup').value.trim(),year:document.getElementById('courseYear').value.trim()});if(type==='student'){if(!data.courses.length){notify('Primero crea un curso');return}const student={id:crypto.randomUUID(),name:document.getElementById('studentName').value.trim(),email:document.getElementById('studentEmail').value.trim(),courseId:document.getElementById('studentCourse').value};data.students.push(student);data.grades.push({id:crypto.randomUUID(),studentId:student.id,courseId:student.courseId,score:''})}if(type==='question')data.questions.push({id:crypto.randomUUID(),text:document.getElementById('questionText').value.trim(),type:document.getElementById('questionType').value});persist();closeModal();renderAdmin();notify('Cambios guardados')}}
    function closeModal(){document.getElementById('modalRoot').innerHTML=''}
    function showPublic(){document.getElementById('adminApp').classList.add('hidden');document.getElementById('publicApp').classList.remove('hidden');studentStep=1;selectedCourse='';selectedStudent='';verified=false;answers={};renderPublic()}
    function showAdmin(){document.getElementById('publicApp').classList.add('hidden');document.getElementById('adminApp').classList.remove('hidden');renderAdmin()}
    document.getElementById('publicMode').onclick=showPublic;document.getElementById('adminMode').onclick=showAdmin;
    function renderPublic(){const panel=document.getElementById('publicPanel');if(studentStep===4){panel.innerHTML='<div class="success"><div class="success-mark">✓</div><h2>¡Gracias por participar!</h2><p>Tus respuestas se han guardado en esta demostración.<br>Tu aportación ayuda al equipo a seguir creciendo.</p><button class="btn btn-light" onclick="showAdmin()">Volver al inicio</button></div>';return}const stepDots=`<div class="step-indicator"><span class="step-dot ${studentStep>=1?'done':''}">1</span><span class="step-line"></span><span class="step-dot ${studentStep>=2?'done':''}">2</span><span class="step-line"></span><span class="step-dot ${studentStep>=3?'done':''}">3</span></div>`;if(studentStep===1){panel.innerHTML=`${stepDots}<h1>Identifícate</h1><p>Selecciona tu curso y tu nombre. Enviaremos un código al correo registrado para confirmar que eres tú.</p><div class="form-grid"><div class="field"><label for="publicCourse">Curso</label><select id="publicCourse"><option value="">Selecciona tu curso</option>${data.courses.map(c=>`<option value="${c.id}">${esc(c.name)} · ${esc(c.group)}</option>`).join('')}</select></div><div class="field"><label for="publicStudent">Tu nombre</label><select id="publicStudent" disabled><option value="">Primero selecciona un curso</option></select></div><div id="publicNotice"></div><button class="btn btn-primary" id="sendCode">Enviar código al correo →</button></div>`;const course=document.getElementById('publicCourse'),student=document.getElementById('publicStudent');course.onchange=()=>{selectedCourse=course.value;student.innerHTML='<option value="">Selecciona tu nombre</option>'+data.students.filter(s=>s.courseId===selectedCourse).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');student.disabled=!selectedCourse};student.onchange=()=>selectedStudent=student.value;document.getElementById('sendCode').onclick=()=>{if(!selectedCourse||!selectedStudent){notify('Selecciona tu curso y tu nombre');return}studentStep=2;renderPublic()};return}if(studentStep===2){const s=data.students.find(x=>x.id===selectedStudent);panel.innerHTML=`${stepDots}<h1>Revisa tu correo</h1><p>Hemos enviado un código de confirmación a <strong>${esc(s?.email||'')}</strong>.</p><div class="notice">Modo demostración: no se envía un correo real. Usa el código <strong>246810</strong> para continuar.</div><div class="form-grid"><div class="field"><label for="verificationCode">Código de 6 dígitos</label><input id="verificationCode" class="code-input" inputmode="numeric" maxlength="6" placeholder="000000"></div><button class="btn btn-primary" id="verifyCode">Confirmar identidad →</button><button class="panel-link" id="changeStudent" style="justify-self:start">← Volver a los datos</button></div>`;document.getElementById('verifyCode').onclick=()=>{if(document.getElementById('verificationCode').value==='246810'){verified=true;studentStep=3;renderPublic()}else notify('El código no coincide')};document.getElementById('changeStudent').onclick=()=>{studentStep=1;renderPublic()};return}const classmates=data.students.filter(s=>s.courseId===selectedCourse&&s.id!==selectedStudent);const questionHtml=data.questions.map((q,i)=>`<div class="question-block"><h3>${i+1}. ${esc(q.text)}</h3>${q.type==='scale'?`<div class="scale">${[1,2,3,4,5].map(n=>`<button type="button" class="${answers[q.id]===String(n)?'selected':''}" data-answer="${q.id}" data-value="${n}">${n}</button>`).join('')}</div>`:`<textarea class="field" data-answer="${q.id}" placeholder="Escribe tu respuesta…" style="width:100%;min-height:80px;border:1px solid var(--line);border-radius:5px;padding:10px;font-size:12px">${esc(answers[q.id]||'')}</textarea>`}</div>`).join('');panel.innerHTML=`${stepDots}<h1>Comparte tu mirada</h1><p>Elige a un compañero o compañera y responde con honestidad y respeto. Tus respuestas son confidenciales.</p>${classmates.length?`<div class="form-grid"><div class="field"><label for="peerSelect">¿A quién quieres evaluar?</label><select id="peerSelect"><option value="">Selecciona un compañero/a</option>${classmates.map(s=>`<option value="${s.id}" ${answers.peer===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>${questionHtml}<div class="notice">Responde desde tu experiencia. La coevaluación busca ayudar, no juzgar.</div><button class="btn btn-primary" id="submitReview">Enviar coevaluación →</button></div>`:'<div class="notice">No hay otros alumnos inscritos en este curso todavía.</div>'}`;panel.querySelectorAll('[data-answer]').forEach(el=>{el.addEventListener(el.tagName==='TEXTAREA'?'input':'click',()=>{answers[el.dataset.answer]=el.dataset.value||el.value;if(el.tagName==='BUTTON'){panel.querySelectorAll(`[data-answer="${el.dataset.answer}"]`).forEach(b=>b.classList.remove('selected'));el.classList.add('selected')}})});const peer=document.getElementById('peerSelect');if(peer)peer.onchange=()=>answers.peer=peer.value;const submit=document.getElementById('submitReview');if(submit)submit.onclick=()=>{if(!verified){notify('Verifica tu identidad para continuar');return}if(!answers.peer){notify('Selecciona a quién quieres evaluar');return}const missing=data.questions.some(q=>!answers[q.id]?.trim());if(missing){notify('Completa todas las preguntas');return}data.responses[selectedStudent]=data.responses[selectedStudent]||[];data.responses[selectedStudent].push({peer:answers.peer,answers:{...answers},createdAt:new Date().toISOString()});persist();studentStep=4;renderPublic()}}
    renderAdmin();
  </script>
</body>
</html>
